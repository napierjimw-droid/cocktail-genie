name: cocktail_genie
description: "Cocktail Genie - Your magical cocktail companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  url_launcher: ^6.3.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8


  # Networking
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # Camera + image picker
  image_picker: ^1.1.2

  # Unique IDs
  uuid: ^4.4.0

  # Google Fonts (Marcellus + Playfair Display + Rakkas)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/genie.png
    - assets/images/genie_wink.png
